run_id: qwenpi_physical_tokens_click_alarmclock
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: your_wandb_entity
wandb_project: vlact-physical-tokens
is_debug: false

framework:
  name: QwenPIPhysicalTokens
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  discrete_conditioning:
    enabled: true
    action_vocab_size: 512
    physics_vocab_size: 0
    max_action_tokens: 8
    max_physics_tokens: 8
    gate_init: 0.1
    action_condition_dropout: 0.0
    physics_condition_dropout: 0.0
    physics_fusion_mode: concat
    physics_fusion_dim: 256
    physics_fusion_heads: 8
    dit_injection_layers: all
    dit_attention_dropout: 0.0
    dit_freeze_base_action_model: false
    dit_action_tokens_only: false
    dit_physics_adapter_type: cross_attention
    dit_physics_memory_pooling: none
    physics_tokens_per_transition: 16
    physics_condition_enabled: true
    physics_usefulness_weight: 0.0
    physics_usefulness_margin: 0.01
  action_model:
    action_model_type: DiT-B
    hidden_size: 512
    add_pos_embed: true
    max_seq_len: 256
    action_dim: 14
    state_dim: 14
    future_action_window_size: 31
    action_horizon: 32
    past_action_window_size: 0
    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 8
    diffusion_model_cfg:
      input_embedding_dim: 512
      cross_attention_dim: 2560
      attention_head_dim: 64
      num_attention_heads: 8
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 8
      output_dim: 512
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./shared_robotwin
    data_mix: robotwin_click_alarmclock_wrap32
    action_type: abs_qpos
    action_mode: abs
    discrete_token_cache: ./artifacts/token_caches/click_alarmclock_clean_ema_step5000.npz
    exclude_episode_ids: [5, 20, 25, 39, 49]
    per_device_batch_size: 8
    image_size: [224, 224]
    video_backend: pyav
    include_state: true
    num_workers: 4

trainer:
  epochs: 100
  max_train_steps: 3000
  num_warmup_steps: 200
  save_interval: 500
  save_trainable_only: true
  eval_interval: 100
  logging_frequency: 10
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
    discrete_conditioner: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  freeze_modules: qwen_vl_interface
  random_init_action_model: true
  pretrained_checkpoint: /mnt/jfzn/liujn/StarVLA/VLAct_Qwen3_Pretrain/checkpoints/steps_100000_pytorch_model.pt
  action_init_checkpoint: null
  physics_tokenizer_init_checkpoint: null
  physics_tokenizer_init_sha256: null
  reload_modules: qwen_vl_interface
  is_resume: false
  reset_steps: true
  repeated_diffusion_steps: 2
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  max_grad_norm: 1.0
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
