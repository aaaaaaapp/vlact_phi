run_id: qwen_dual_token_probe_d23_8tasks
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: your_wandb_entity
wandb_project: vlact-physical-tokens
is_debug: false

framework:
  name: QwenDualTokenProbe
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
  dual_token_probe:
    action_vocab_size: 128
    action_token_count: 4
    physics_vocab_size: 128
    physics_token_count: 256
    hidden_size: 1024
    action_condition_dim: 256
    action_loss_weight: 0.0
    physics_loss_weight: 1.0
    action_distill_weight: 10.0
    action_distill_temperature: 1.0
    enable_action_teacher: true
    dropout: 0.0
    train_last_n_layers: 2
    # Keep the mature D17 action prompt identical so step-zero logits match exactly.
    prompt_template: "Task: {instruction}\nPredict the next robot action tokens."

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./shared_robotwin
    data_mix: robotwin_phystoken_d15_8tasks_wrap32
    action_type: abs_qpos
    action_mode: abs
    discrete_token_cache: ./artifacts/token_caches/robotwin_d23_8tasks_dual_action4_physics256.npz
    include_episode_ids: [0, 1, 2, 3, 4, 6]
    per_device_batch_size: 1
    image_size: [224, 224]
    video_backend: pyav
    include_state: true
    num_workers: 2
    balance_dataset_weights: false
    balance_trajectory_weights: false

trainer:
  epochs: 100
  max_train_steps: 500
  num_warmup_steps: 50
  save_interval: 500
  save_trainable_only: true
  eval_interval: 501
  logging_frequency: 1
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 2.0e-6
    action_token_probe: 1.0e-5
    action_condition_embedding: 1.0e-4
    physics_token_probe: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 2.0e-7
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  freeze_modules: ''
  pretrained_checkpoint: /mnt/jfzn/liujn/StarVLA/VLAct_Qwen3_Pretrain/checkpoints/steps_100000_pytorch_model.pt
  dual_action_probe_init_checkpoint: results/Checkpoints/qwen_action_token_probe_d16_8tasks_seed42_steps1000/checkpoints/steps_1000_pytorch_model.pt
  dual_action_probe_init_sha256: d12a26c26fbff2efb32a37ecc2774ce12387e95566107aa81811092b7b7442a4
  reload_modules: qwen_vl_interface
  is_resume: false
  reset_steps: true
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
