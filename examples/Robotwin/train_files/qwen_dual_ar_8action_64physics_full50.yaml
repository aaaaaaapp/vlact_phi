run_id: qwen_dual_ar_8action_64physics_full50
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: your_wandb_entity
wandb_project: vlact-physical-tokens
is_debug: false

framework:
  name: QwenDualAutoregressiveReasoner
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
  action_token_reasoner:
    vocab_size: 525
    token_count: 8
    token_offset: 151669
    train_last_n_layers: 2
  dual_autoregressive_reasoner:
    physics_vocab_size: 2048
    physics_token_count: 64
    separate_heads: true
    strict_modality_tying: true
    action_ce_weight: 1.0
    physics_ce_weight: 1.0
    prompt_template: "Task: {instruction}\nPredict 8 robot action tokens, then 64 future physics tokens."

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/jfzn/liujn/code/Starvla/Starvla/playground/Datasets/RoboTwin
    data_mix: robotwin_wrap_32
    action_type: abs_qpos
    action_mode: abs
    discrete_token_cache: ./artifacts/robotwin_full50_study/dual_ar_8action_64physics_targets.npz
    discrete_token_cache_drop_missing: true
    exclude_episode_ids: [5, 20, 25, 39, 49]
    per_device_batch_size: 1
    image_size: [224, 224]
    video_backend: pyav
    include_state: true
    num_workers: 2

trainer:
  epochs: 100
  max_train_steps: 500
  num_warmup_steps: 50
  save_interval: 500
  save_trainable_only: true
  eval_interval: 501
  logging_frequency: 10
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  freeze_modules: ''
  pretrained_checkpoint: /mnt/jfzn/liujn/StarVLA/VLAct_Qwen3_Pretrain/checkpoints/steps_100000_pytorch_model.pt
  expanded_vocab_warmstart: true
  is_resume: false
  reset_steps: true
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
