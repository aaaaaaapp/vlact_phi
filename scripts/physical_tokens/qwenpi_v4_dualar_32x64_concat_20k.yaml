run_id: qwenpi_v4_dualar_32x64_fresh40k_concat_m8_ga4_gc0_steps20000_v1
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: your_wandb_entity
wandb_project: vlact-physical-tokens
is_debug: false

framework:
  name: QwenPIv4DualAR32x64
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
  action_model:
    expert_model_path: ./playground/Pretrained_models/Qwen3-0.6B
    action_dim: 14
    future_action_window_size: 31
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_inference_timesteps: 4
    repeated_diffusion_steps: 1
  action_token_reasoner:
    vocab_size: 525
    token_count: 32
    token_offset: 151669
  dual_autoregressive_reasoner:
    physics_vocab_size: 2048
    physics_token_count: 64
    separate_heads: true
    strict_modality_tying: true
    prompt_template: "Task: {instruction}\nPredict 32 robot action tokens, then 64 future physics tokens."
    lora:
      enabled: true
      rank: 32
      alpha: 32
      dropout: 0.05
      target_modules:
        - self_attn.q_proj
        - self_attn.k_proj
        - self_attn.v_proj
        - self_attn.o_proj
        - mlp.gate_proj
        - mlp.up_proj
        - mlp.down_proj
  dual_ar_policy:
    condition_source: predicted
    action_loss_weight: 1.0e-3
    physics_loss_weight: 1.0e-4
    fusion_bottleneck: 256

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/jfzn/liujn/code/Starvla/Starvla/playground/Datasets/RoboTwin
    data_mix: robotwin_wrap_32
    action_type: abs_qpos
    action_mode: abs
    discrete_token_cache: ./artifacts/robotwin_full50_study/dual_ar_32action_64physics_targets.npz
    discrete_token_cache_drop_missing: true
    exclude_episode_ids: [5, 20, 25, 39, 49]
    pretrained_stats_path: /mnt/jfzn/liujn/models/StarVLA/VLAct_Qwen3PI_Robotwin_all_Finetune/dataset_statistics.json
    per_device_batch_size: 8
    image_size: [224, 224]
    video_backend: pyav
    include_state: true
    num_workers: 2

trainer:
  epochs: 100
  max_train_steps: 20000
  num_warmup_steps: 1000
  save_interval: 5000
  save_trainable_only: true
  eval_interval: 20001
  logging_frequency: 10
  log_metrics_jsonl: true
  learning_rate:
    base: 1.0e-4
    prefix_proj: 1.0e-5
    action_in_proj: 1.0e-5
    action_out_proj: 1.0e-5
    time_mlp: 1.0e-5
    action_pos_embed: 1.0e-5
    expert_layers: 1.0e-5
    expert_final_norm: 1.0e-5
    lora_adapters: 1.0e-5
    action_embeddings: 1.0e-5
    physics_embeddings: 1.0e-5
    action_token_memory: 1.0e-4
    physics_token_memory: 1.0e-4
    pi_concat_fusers: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  pretrained_checkpoint: /mnt/jfzn/liujn/models/StarVLA/VLAct_Qwen3PI_Robotwin_all_Finetune/checkpoints/steps_100000_pytorch_model.pt
  dual_ar_trainable_checkpoint: ./results/Checkpoints/qwen_dual_ar_32a64p_full50_seed42_steps40000_strict_tied_heads_uniform_physics_init_lora_r32_robotwin_ft_acp_2gpu_fresh_m16_ga4_gc0_correctlr_gradnorm_v2/checkpoints/steps_40000_pytorch_model.pt
  expanded_vocab_warmstart: true
  freeze_modules: ''
  is_resume: false
  reset_steps: true
  gradient_accumulation_steps: 4
  gradient_clipping: 1.0
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
  endpoint_wrap_loss_weight: 0.5
  shortest_angular_joint_loss_diff: true
