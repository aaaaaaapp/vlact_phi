<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Move Playingcard Away - Paired Rollout Comparison</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dee8;
      --surface: #ffffff;
      --page: #f4f6f8;
      --success: #087443;
      --success-bg: #e9f7ef;
      --failure: #b42318;
      --failure-bg: #fff0ee;
      --accent: #9a6700;
      --accent-bg: #fff8db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
    }

    .header-inner,
    main {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 72px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 720;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .totals {
      display: flex;
      gap: 18px;
      font-size: 13px;
      white-space: nowrap;
    }

    .totals strong { font-size: 18px; }
    .pure-total strong { color: #475467; }
    .action-total strong { color: var(--accent); }
    .soft-total strong { color: #175cd3; }

    main { padding: 24px 0 48px; }

    .episode {
      margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }

    .episode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      padding: 9px 12px 9px 16px;
      border-bottom: 1px solid var(--line);
    }

    .seed {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .episode-index {
      margin-left: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .row-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    button,
    select {
      height: 34px;
      border: 1px solid #c8d0dc;
      border-radius: 6px;
      background: #fff;
      color: #344054;
      font: inherit;
      font-size: 13px;
    }

    button {
      min-width: 38px;
      padding: 0 11px;
      cursor: pointer;
    }

    button:hover { background: #f2f4f7; }
    button:focus-visible,
    select:focus-visible { outline: 2px solid #2e90fa; outline-offset: 2px; }
    select { padding: 0 28px 0 9px; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .method {
      min-width: 0;
      padding: 12px;
      border-right: 1px solid var(--line);
    }

    .method:last-child { border-right: 0; }

    .method-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 32px;
      margin-bottom: 8px;
    }

    .method-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      flex: none;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
      line-height: 1;
    }

    .success { color: var(--success); background: var(--success-bg); }
    .failure { color: var(--failure); background: var(--failure-bg); }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #111;
      object-fit: contain;
    }

    .disagreement {
      color: var(--accent);
      background: var(--accent-bg);
    }

    @media (max-width: 900px) {
      .header-inner { align-items: flex-start; flex-direction: column; padding: 14px 0; }
      .totals { width: 100%; justify-content: space-between; }
      .video-grid { grid-template-columns: 1fr; }
      .method { border-right: 0; border-bottom: 1px solid var(--line); }
      .method:last-child { border-bottom: 0; }
    }

    @media (max-width: 560px) {
      .header-inner,
      main { width: min(100% - 20px, 1500px); }
      .episode-bar { align-items: flex-start; flex-direction: column; }
      .row-controls { width: 100%; }
      .row-controls button { flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Move Playingcard Away</h1>
        <div class="subtitle">6 paired episodes · identical scene seeds within each row</div>
      </div>
      <div class="totals" aria-label="Success totals">
        <span class="pure-total"><strong>6/6</strong> Pure Pi</span>
        <span class="action-total"><strong>6/6</strong> Action-only</span>
        <span class="soft-total"><strong>6/6</strong> Soft dual</span>
      </div>
    </div>
  </header>

  <main id="episodes"></main>

  <script>
    const root = "../../Starvla/Starvla/playground/RoboTwin_eval/eval_result/move_playingcard_away/model2robotwin_interface/demo_clean";
    const methods = [
      { key: "pure", label: "Pure Pi · no discrete memory" },
      { key: "action", label: "Action-only · predicted action tokens" },
      { key: "soft", label: "Soft dual · action + physics tokens" },
    ];
    const episodes = [
      {
        seed: 100000,
        files: {
          pure: ["d52_move_pure_fixed_seed0/2026-09-28%2022:15:26/episode0_success.mp4", true],
          action: ["d52_move_action_only_fixed_seed0/2026-09-28%2022:19:54/episode0_success.mp4", true],
          soft: ["d52_move_soft_t1_fixed_seed0/2026-09-28%2022:19:54/episode0_success.mp4", true],
        },
      },
      {
        seed: 100002,
        files: {
          pure: ["d52_move_pure_fixed_seed0/2026-09-28%2022:15:26/episode1_success.mp4", true],
          action: ["d52_move_action_only_fixed_seed0/2026-09-28%2022:19:54/episode1_success.mp4", true],
          soft: ["d52_move_soft_t1_fixed_seed0/2026-09-28%2022:19:54/episode1_success.mp4", true],
        },
      },
      {
        seed: 100003,
        files: {
          pure: ["d52_move_pure_fixed_seed0/2026-09-28%2022:15:26/episode2_success.mp4", true],
          action: ["d52_move_action_only_fixed_seed0/2026-09-28%2022:19:54/episode2_success.mp4", true],
          soft: ["d52_move_soft_t1_fixed_seed0/2026-09-28%2022:19:54/episode2_success.mp4", true],
        },
      },
      {
        seed: 200000,
        files: {
          pure: ["d52_move_pure_fixed_seed1/2026-09-28%2022:24:55/episode0_success.mp4", true],
          action: ["d52_move_action_only_fixed_seed1/2026-09-28%2022:24:55/episode0_success.mp4", true],
          soft: ["d52_move_soft_t1_fixed_seed1/2026-09-28%2022:24:55/episode0_success.mp4", true],
        },
      },
      {
        seed: 200001,
        files: {
          pure: ["d52_move_pure_fixed_seed1/2026-09-28%2022:24:55/episode1_success.mp4", true],
          action: ["d52_move_action_only_fixed_seed1/2026-09-28%2022:24:55/episode1_success.mp4", true],
          soft: ["d52_move_soft_t1_fixed_seed1/2026-09-28%2022:24:55/episode1_success.mp4", true],
        },
      },
      {
        seed: 200002,
        files: {
          pure: ["d52_move_pure_fixed_seed1/2026-09-28%2022:24:55/episode2_success.mp4", true],
          action: ["d52_move_action_only_fixed_seed1/2026-09-28%2022:24:55/episode2_success.mp4", true],
          soft: ["d52_move_soft_t1_fixed_seed1/2026-09-28%2022:24:55/episode2_success.mp4", true],
        },
      },
    ];

    const container = document.querySelector("#episodes");

    episodes.forEach((episode, index) => {
      const outcomes = methods.map(({ key }) => episode.files[key][1]);
      const differs = new Set(outcomes).size > 1;
      const section = document.createElement("section");
      section.className = "episode";
      section.innerHTML = `
        <div class="episode-bar ${differs ? "disagreement" : ""}">
          <div class="seed">Seed ${episode.seed}<span class="episode-index">Pair ${index + 1}</span></div>
          <div class="row-controls">
            <button type="button" data-action="play" title="Play this row">Play</button>
            <button type="button" data-action="pause" title="Pause this row">Pause</button>
            <button type="button" data-action="reset" title="Reset this row">Reset</button>
            <select aria-label="Playback speed">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </div>
        </div>
        <div class="video-grid">
          ${methods.map(({ key, label }) => {
            const [file, success] = episode.files[key];
            const outcome = success ? "SUCCESS" : "FAILURE";
            return `
              <div class="method">
                <div class="method-head">
                  <span class="method-name">${label}</span>
                  <span class="badge ${success ? "success" : "failure"}">${outcome}</span>
                </div>
                <video controls muted playsinline preload="metadata" src="${root}/${file}"></video>
              </div>`;
          }).join("")}
        </div>`;

      const videos = [...section.querySelectorAll("video")];
      section.querySelector('[data-action="play"]').addEventListener("click", () => {
        const startAt = Math.min(...videos.map((video) => video.currentTime));
        videos.forEach((video) => {
          video.currentTime = startAt;
          video.play();
        });
      });
      section.querySelector('[data-action="pause"]').addEventListener("click", () => {
        videos.forEach((video) => video.pause());
      });
      section.querySelector('[data-action="reset"]').addEventListener("click", () => {
        videos.forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });
      });
      section.querySelector("select").addEventListener("change", (event) => {
        videos.forEach((video) => { video.playbackRate = Number(event.target.value); });
      });
      container.appendChild(section);
    });
  </script>
</body>
</html>
